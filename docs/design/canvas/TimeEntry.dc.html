<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time entry sheet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/styles.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/fonts.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/colors.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/typography.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/spacing.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/radius.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/elevation.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/motion.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/base.css">

<script src="ds/dreambigdesignsystem_59eada/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap">
<style>
body{margin:0}
/* NEW (proposed): DreamBig has only "lnum". Times need tabular figures. */
:root{--font-features-tabular:"lnum" 1,"tnum" 1}
a{color:var(--text-link)}a:hover{color:var(--color-primary-active)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--canvas); color: var(--text-body); font-family: var(--font-sans); font-feature-settings: var(--font-features); position: relative; overflow: hidden;">

  <div aria-hidden="true" style="display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; height: 60px; padding: 0 var(--space-md); background: var(--surface-card); border-bottom: 1px solid var(--border-hairline); font-weight: var(--weight-bold); font-size: var(--size-title); letter-spacing: -0.8px;">Swim Meet</div>
    <div style="padding: var(--space-md); background: var(--surface-card); font: var(--type-heading-2); letter-spacing: var(--tracking-heading-2);">Shark Invitational</div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.28);"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 48px; display: flex; flex-direction: column; gap: var(--space-sm); box-sizing: border-box; padding: var(--space-xs) var(--space-md) var(--space-md); background: var(--surface-card); border-radius: var(--radius-well) var(--radius-well) 0 0; box-shadow: var(--shadow-modal);">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: var(--radius-full); background: var(--border-input);"></span>

    <div style="display: flex; align-items: flex-start; gap: var(--space-xs);">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-xxs);">
        <h2 id="sheet-title" style="margin: 0; font: var(--type-title); letter-spacing: var(--tracking-title);">Jayden · 50 Freestyle</h2>
        <span style="font: var(--type-caption); color: var(--text-muted);">#12 · Timed final · Heat 3 · Lane 4 · Seed <span style="font-feature-settings: var(--font-features-tabular);">30.12</span></span>
      </div>
      <a href="MeetEditor.dc.html" aria-label="Close" style="display: inline-flex;"><x-import component-from-global-scope="DreamBigDesignSystem_59eada.IconButton" icon="x" label="Close" tone="on-light" size="{{n44}}"></x-import></a>
    </div>

    <div role="radiogroup" aria-label="Time type" style="display: flex; background: var(--canvas); border-radius: var(--radius-full); padding: var(--space-xxs);">
      <button type="button" role="radio" aria-checked="true" style="flex: 1; height: 44px; border: 0; border-radius: var(--radius-full); background: var(--surface-card); box-shadow: var(--shadow-soft); font: var(--type-button); font-family: var(--font-sans); color: var(--text-body);">Live time</button>
      <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 44px; border: 0; border-radius: var(--radius-full); background: transparent; font: var(--type-button); font-family: var(--font-sans); color: var(--text-muted);">Official time</button>
    </div>

    <div role="radiogroup" aria-label="Status" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-xxs); background: var(--canvas); border-radius: var(--radius-md); padding: var(--space-xxs);">
      <button type="button" role="radio" aria-checked="true" style="height: 44px; border: 0; border-radius: var(--radius-sm); background: var(--surface-card); box-shadow: var(--shadow-soft); font: var(--type-body-sm); font-weight: var(--weight-medium); font-family: var(--font-sans); color: var(--text-body);">Swum</button>
      <button type="button" role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: var(--radius-sm); background: transparent; font: var(--type-body-sm); font-family: var(--font-sans); color: var(--text-secondary);">DQ</button>
      <button type="button" role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: var(--radius-sm); background: transparent; font: var(--type-body-sm); font-family: var(--font-sans); color: var(--text-secondary);">No Show</button>
      <button type="button" role="radio" aria-checked="false" style="height: 44px; border: 0; border-radius: var(--radius-sm); background: transparent; font: var(--type-body-sm); font-family: var(--font-sans); color: var(--text-secondary);">Scratched</button>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-md); border: 1px solid var(--border-hairline); border-radius: var(--radius-well);">
      <output aria-live="polite" aria-label="Live time 29.48" style="font: var(--type-display-1); letter-spacing: var(--tracking-display-1); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">29.48</output>
      <div style="display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: var(--space-sm);">
        <span style="display: inline-flex; align-items: center; gap: var(--space-xxs); font: var(--type-caption); font-weight: var(--weight-semibold); font-feature-settings: var(--font-features-tabular);">
          <x-import component-from-global-scope="DreamBigDesignSystem_59eada.Icon" name="arrow-down" size="{{n16}}" color="var(--accent-green)"></x-import>
          <span>−0.64</span><span style="font-weight: var(--weight-regular); color: var(--text-muted);">faster</span>
        </span>
        <span style="display: inline-flex; border: 1px dashed var(--text-faint); border-radius: var(--radius-full);"><x-import component-from-global-scope="DreamBigDesignSystem_59eada.BadgePill" tone="ink" dot="var(--accent-green)">Provisional personal best</x-import></span>
      </div>
    </div>

    <div role="group" aria-label="Number pad" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-xs);">
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--canvas); font: var(--type-heading-2); font-family: var(--font-sans); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">1</button>
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--canvas); font: var(--type-heading-2); font-family: var(--font-sans); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">2</button>
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--canvas); font: var(--type-heading-2); font-family: var(--font-sans); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">3</button>
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--canvas); font: var(--type-heading-2); font-family: var(--font-sans); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">4</button>
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--canvas); font: var(--type-heading-2); font-family: var(--font-sans); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">5</button>
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--canvas); font: var(--type-heading-2); font-family: var(--font-sans); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">6</button>
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--canvas); font: var(--type-heading-2); font-family: var(--font-sans); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">7</button>
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--canvas); font: var(--type-heading-2); font-family: var(--font-sans); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">8</button>
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--canvas); font: var(--type-heading-2); font-family: var(--font-sans); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">9</button>
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--surface-card); box-shadow: inset 0 0 0 1px var(--border-hairline); font: var(--type-button); font-family: var(--font-sans); color: var(--text-secondary);">Clear</button>
      <button type="button" style="height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--canvas); font: var(--type-heading-2); font-family: var(--font-sans); font-feature-settings: var(--font-features-tabular); color: var(--text-heading);">0</button>
      <button type="button" aria-label="Backspace" style="display: flex; align-items: center; justify-content: center; height: 60px; border: 0; border-radius: var(--radius-lg); background: var(--surface-card); box-shadow: inset 0 0 0 1px var(--border-hairline); color: var(--text-secondary);"><x-import component-from-global-scope="DreamBigDesignSystem_59eada.Icon" name="delete" size="{{n28}}"></x-import></button>
    </div>

    <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Notes" placeholder="Relay leg, split…"></x-import>

    <div style="display: flex; gap: var(--space-xs); margin-top: auto;">
      <span style="flex: 1; display: flex;"><x-import component-from-global-scope="DreamBigDesignSystem_59eada.Button" variant="secondary" size="lg" full-width="{{yes}}" trailing-icon="arrow-right">Save and next</x-import></span>
      <span style="flex: 1; display: flex;"><x-import component-from-global-scope="DreamBigDesignSystem_59eada.Button" variant="primary" size="lg" icon="check" full-width="{{yes}}">Save</x-import></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, n16: 16, n20: 20, n24: 24, n28: 28, n44: 44 }; }
}
</script>
</body>
</html>
