<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swimmer settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/styles.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/fonts.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/colors.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/typography.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/spacing.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/radius.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/elevation.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/motion.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/base.css">
<script src="/_blob/618d86b92ca8d894604b56ae1d973a10"></script>
<script src="ds/dreambigdesignsystem_59eada/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap">
<style>
body{margin:0}
/* NEW (proposed): DreamBig has only "lnum". Times need tabular figures. */
:root{--font-features-tabular:"lnum" 1,"tnum" 1}
a{color:var(--text-link)}a:hover{color:var(--color-primary-active)}
</style>
</helmet>
<div style="width: 390px; height: 1500px; box-sizing: border-box; background: var(--canvas); color: var(--text-body); font-family: var(--font-sans); font-feature-settings: var(--font-features); display: flex; flex-direction: column; overflow: hidden;">

  <header style="display: flex; align-items: center; gap: var(--space-sm); height: 60px; padding: 0 var(--space-md); background: var(--surface-card); border-bottom: 1px solid var(--border-hairline); flex: none;">
    <a href="HomeEditor.dc.html" style="flex: 1; font-weight: var(--weight-bold); font-size: var(--size-title); line-height: 1; letter-spacing: -0.8px; color: var(--text-heading); text-decoration: none;">Swim Meet</a>
    <div role="group" aria-label="Language" style="display: inline-flex; background: var(--canvas); border-radius: var(--radius-full);">
      <button type="button" aria-pressed="true" style="min-width: 56px; height: 44px; padding: 0 var(--space-sm); border: 0; border-radius: var(--radius-full); background: var(--surface-card); box-shadow: var(--shadow-soft); font: var(--type-button); font-family: var(--font-sans); color: var(--text-body);">EN</button>
      <button type="button" aria-pressed="false" style="min-width: 56px; height: 44px; padding: 0 var(--space-sm); border: 0; border-radius: var(--radius-full); background: transparent; font: var(--type-button); font-family: var(--font-sans); color: var(--text-muted);">中文</button>
    </div>
    <x-import component-from-global-scope="DreamBigDesignSystem_59eada.IconButton" icon="circle-user" label="Account: sign out" tone="on-light" size="{{n44}}"></x-import>
  </header>

  <div style="flex: none; display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-md) var(--space-sm) var(--space-xs); background: var(--surface-card); border-bottom: 1px solid var(--border-hairline);">
    <a href="SwimmerUpcomingEditor.dc.html" aria-label="Back to Jayden" style="display: inline-flex;"><x-import component-from-global-scope="DreamBigDesignSystem_59eada.IconButton" icon="chevron-left" label="Back to Jayden" tone="on-light" size="{{n44}}"></x-import></a>
    <h1 style="flex: 1; margin: 0; font: var(--type-heading-2); letter-spacing: var(--tracking-heading-2);">Swimmer settings</h1>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; gap: var(--space-md); padding: var(--space-md);">

    <section style="display: flex; flex-direction: column; gap: var(--space-md); padding: var(--pad-card); background: var(--surface-card); border: 1px solid var(--border-hairline); border-radius: var(--radius-card);">
      <h2 style="margin: 0; font: var(--type-title); letter-spacing: var(--tracking-title);">Profile</h2>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Name" default-value="Jayden" hint="First name only. This is public."></x-import>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Chinese name (optional)" placeholder="[中文名]"></x-import>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="URL slug" default-value="jayden" hint="Part of this swimmer's public link."></x-import>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.Button" variant="primary" size="lg" full-width="{{yes}}">Save changes</x-import>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-md); padding: var(--pad-card); background: var(--surface-featured); border: 1px solid var(--border-hairline); border-radius: var(--radius-card);">
      <div style="display: flex; align-items: center; gap: var(--space-xs);">
        <x-import component-from-global-scope="DreamBigDesignSystem_59eada.Icon" name="lock" size="{{n20}}" color="var(--text-secondary)"></x-import>
        <h2 style="flex: 1; margin: 0; font: var(--type-title); letter-spacing: var(--tracking-title);">Private</h2>
      </div>
      <p style="margin: 0; font: var(--type-body-sm); color: var(--text-secondary);">Never shown publicly. Only editors of this swimmer can see these.</p>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Date of birth" type="date"></x-import>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font: var(--type-caption); color: var(--text-secondary);">Gender</span>
        <span style="display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-input); background: var(--surface-card); border: 1px solid var(--border-input); border-radius: var(--radius-input); font: var(--type-body-sm); color: var(--text-faint);">
          <span style="flex: 1;">Choose</span>
          <x-import component-from-global-scope="DreamBigDesignSystem_59eada.Icon" name="chevron-down" size="{{n16}}" color="var(--text-muted)"></x-import>
        </span>
      </label>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-md); padding: var(--pad-card); background: var(--surface-card); border: 1px solid var(--border-hairline); border-radius: var(--radius-card);">
      <h2 style="margin: 0; font: var(--type-title); letter-spacing: var(--tracking-title);">Who can edit</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
        <li style="display: flex; align-items: center; gap: var(--space-sm); min-height: 56px; border-bottom: 1px solid var(--border-hairline);">
          <span style="flex: 1; font: var(--type-body-sm);">You</span>
          <span style="font: var(--type-caption); color: var(--text-muted);">Owner</span>
        </li>
        <li style="display: flex; align-items: center; gap: var(--space-sm); min-height: 56px; border-bottom: 1px solid var(--border-hairline);">
          <span style="flex: 1; min-width: 0; font: var(--type-body-sm);">[editor email]</span>
          <x-import component-from-global-scope="DreamBigDesignSystem_59eada.Button" variant="secondary" size="md">Remove</x-import>
        </li>
      </ul>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Share by email" type="email" default-value="[email address]" invalid="{{yes}}" hint="No account with that email. Accounts are created by the admin."></x-import>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.Button" variant="secondary" size="lg" icon="user-plus" full-width="{{yes}}">Share</x-import>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-md); padding: var(--pad-card); background: var(--surface-card); border: 1px solid var(--border-hairline); border-radius: var(--radius-card);">
      <h2 style="margin: 0; font: var(--type-title); letter-spacing: var(--tracking-title);">Delete swimmer</h2>
      <p style="margin: 0; font: var(--type-body-sm); color: var(--text-secondary);">Removes Jayden and every entry and result. This cannot be undone.</p>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Type Jayden to confirm" placeholder="Jayden"></x-import>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.Button" variant="secondary" size="lg" icon="trash-2" disabled="{{yes}}" full-width="{{yes}}">Delete swimmer</x-import>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, n16: 16, n20: 20, n24: 24, n44: 44 }; }
}
</script>
</body>
</html>
