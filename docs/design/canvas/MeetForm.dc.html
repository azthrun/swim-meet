<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meet form</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/styles.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/fonts.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/colors.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/typography.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/spacing.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/radius.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/elevation.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/motion.css">
<link rel="stylesheet" href="ds/dreambigdesignsystem_59eada/tokens/base.css">
<script src="/_blob/618d86b92ca8d894604b56ae1d973a10"></script>
<script src="ds/dreambigdesignsystem_59eada/_ds_bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;display=swap">
<style>
body{margin:0}
/* NEW (proposed): DreamBig has only "lnum". Times need tabular figures. */
:root{--font-features-tabular:"lnum" 1,"tnum" 1}
a{color:var(--text-link)}a:hover{color:var(--color-primary-active)}
</style>
</helmet>
<div style="width: 820px; height: 1000px; display: flex; gap: 40px; font-family: var(--font-sans); font-feature-settings: var(--font-features); color: var(--text-body);">

  <!-- Edit meet: course locked -->
  <div style="width: 390px; height: 1000px; flex: none; box-sizing: border-box; background: var(--canvas); display: flex; flex-direction: column; overflow: hidden;">
    <div style="flex: none; display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-md) var(--space-sm) var(--space-xs); background: var(--surface-card); border-bottom: 1px solid var(--border-hairline);">
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.IconButton" icon="x" label="Cancel" tone="on-light" size="{{n44}}"></x-import>
      <h1 style="flex: 1; margin: 0; font: var(--type-heading-2); letter-spacing: var(--tracking-heading-2);">Edit meet</h1>
    </div>
    <main style="flex: 1; display: flex; flex-direction: column; gap: var(--space-md); padding: var(--space-lg) var(--space-md);">
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Name" default-value="Shark Invitational"></x-import>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Chinese name (optional)" placeholder="[中文名]"></x-import>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font: var(--type-caption); color: var(--text-secondary);">Course</span>
        <div style="display: flex; align-items: center; gap: var(--space-sm); min-height: 44px; padding: 0 var(--space-sm); background: var(--canvas); border: 1px solid var(--border-hairline); border-radius: var(--radius-input);">
          <span style="display: inline-flex; border: 1px solid var(--border-hairline); border-radius: var(--radius-full);"><x-import component-from-global-scope="DreamBigDesignSystem_59eada.BadgePill" tone="ink">SCY</x-import></span>
          <span style="flex: 1; font: var(--type-body-sm);">Short Course Yards</span>
          <x-import component-from-global-scope="DreamBigDesignSystem_59eada.Icon" name="lock" size="{{n16}}" color="var(--text-muted)"></x-import>
        </div>
        <span style="font: var(--type-caption); color: var(--text-muted);">Can't change: this meet already has 4 entries.</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-sm);">
        <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Start date" default-value="Nov 14, 2026"></x-import>
        <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="End date" default-value="Nov 15, 2026"></x-import>
      </div>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Location (optional)" default-value="Riverside Aquatic Center"></x-import>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Live results link (optional)" type="url" placeholder="https://"></x-import>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font: var(--type-caption); color: var(--text-secondary);">Notes (optional)</span>
        <textarea rows="3" style="resize: vertical; padding: var(--space-input); background: var(--surface-card); border: 1px solid var(--border-input); border-radius: var(--radius-input); font: var(--type-body-sm); font-family: var(--font-sans); color: var(--text-body);"></textarea>
      </label>
    </main>
    <div style="flex: none; padding: var(--space-md); background: var(--surface-card); border-top: 1px solid var(--border-hairline);">
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.Button" variant="primary" size="lg" icon="check" full-width="{{yes}}">Save meet</x-import>
    </div>
  </div>

  <!-- New meet -->
  <div style="width: 390px; height: 1000px; flex: none; box-sizing: border-box; background: var(--canvas); display: flex; flex-direction: column; overflow: hidden;">
    <div style="flex: none; display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-md) var(--space-sm) var(--space-xs); background: var(--surface-card); border-bottom: 1px solid var(--border-hairline);">
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.IconButton" icon="x" label="Cancel" tone="on-light" size="{{n44}}"></x-import>
      <h1 style="flex: 1; margin: 0; font: var(--type-heading-2); letter-spacing: var(--tracking-heading-2);">New meet</h1>
    </div>
    <main style="flex: 1; display: flex; flex-direction: column; gap: var(--space-md); padding: var(--space-lg) var(--space-md);">
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Name" placeholder="Meet name"></x-import>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Chinese name (optional)" placeholder="比赛中文名"></x-import>
      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px;">
        <legend style="padding: 0 0 6px; font: var(--type-caption); color: var(--text-secondary);">Course</legend>
        <div role="radiogroup" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-xxs); padding: var(--space-xxs); background: var(--hairline-grey); border-radius: var(--radius-md);">
          <button type="button" role="radio" aria-checked="true" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 56px; border: 0; border-radius: var(--radius-sm); background: var(--surface-card); box-shadow: var(--shadow-soft); font-family: var(--font-sans); color: var(--text-body);"><span style="font: var(--type-button);">SCY</span><span style="font: var(--type-eyebrow); color: var(--text-muted);">Short Course Yards</span></button>
          <button type="button" role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 56px; border: 0; border-radius: var(--radius-sm); background: transparent; font-family: var(--font-sans); color: var(--text-secondary);"><span style="font: var(--type-button);">SCM</span><span style="font: var(--type-eyebrow); color: var(--text-muted);">Short Course Meters</span></button>
          <button type="button" role="radio" aria-checked="false" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 56px; border: 0; border-radius: var(--radius-sm); background: transparent; font-family: var(--font-sans); color: var(--text-secondary);"><span style="font: var(--type-button);">LCM</span><span style="font: var(--type-eyebrow); color: var(--text-muted);">Long Course Meters</span></button>
        </div>
      </fieldset>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-sm);">
        <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Start date" type="date"></x-import>
        <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="End date" type="date" hint="Same day if blank"></x-import>
      </div>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Location (optional)" placeholder="Pool name"></x-import>
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.TextInput" label="Live results link (optional)" type="url" placeholder="https://"></x-import>
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font: var(--type-caption); color: var(--text-secondary);">Notes (optional)</span>
        <textarea rows="3" style="resize: vertical; padding: var(--space-input); background: var(--surface-card); border: 1px solid var(--border-input); border-radius: var(--radius-input); font: var(--type-body-sm); font-family: var(--font-sans); color: var(--text-body);"></textarea>
      </label>
    </main>
    <div style="flex: none; padding: var(--space-md); background: var(--surface-card); border-top: 1px solid var(--border-hairline);">
      <x-import component-from-global-scope="DreamBigDesignSystem_59eada.Button" variant="primary" size="lg" icon="plus" full-width="{{yes}}">Create meet</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true, n12: 12, n16: 16, n20: 20, n24: 24, n44: 44 }; }
}
</script>
</body>
</html>
